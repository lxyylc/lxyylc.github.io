<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Xiai Zhang's personal homepage. Contact: zhangxiai@smail.nju.edu.cn.">
    <meta name="author" content="Xiai Zhang">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Xiai Zhang — Homepage">
    <meta property="og:description" content="Personal homepage of Xiai Zhang.">
    <title>Xiai Zhang — Homepage</title>
    <style>
      :root { color-scheme: light; font-size: 16px; }
      *, *::before, *::after { box-sizing: border-box; }
      html { scroll-behavior: smooth; }
      body {
        margin: 0;
        background: #fff;
        color: #333;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        line-height: 1.6;
      }
      a { color: #2f7fbd; text-decoration: none; }
      a:hover { text-decoration: underline; }
      a:focus-visible { outline: 2px solid #2f7fbd; outline-offset: 5px; border-radius: 2px; }
      .skip-link { position: absolute; top: -100px; left: 16px; padding: 8px 16px; background: #fff; z-index: 10; }
      .skip-link:focus { top: 8px; }
      .masthead { border-bottom: 1px solid #f0f1f2; }
      .nav {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px 24px;
        max-width: 1280px;
        min-height: 58px;
        margin: auto;
        padding: 8px 32px;
      }
      .nav a { color: #4f5963; font-size: 0.9375rem; font-weight: 600; padding: 7px 0; }
      .nav .home-link { margin-right: auto; color: #222; font-size: 1rem; font-weight: 700; }
      .layout {
        display: grid;
        grid-template-columns: 260px minmax(0, 1fr);
        gap: 42px;
        max-width: 1180px;
        margin: auto;
        padding: 40px 32px 80px;
      }
      .profile { min-width: 0; text-align: center; }
      .portrait {
        width: 160px;
        height: 160px;
        margin: 0 auto 20px;
        border: 1px solid #eceff1;
        border-radius: 50%;
        background: #fafbfc;
      }
      /* To add a photo, replace the empty portrait div with:
         <img class="portrait" src="photo.jpg" alt="Xiai Zhang">
         and upload photo.jpg beside index.html. */
      img.portrait { display: block; object-fit: cover; }
      .profile h1 { margin: 0 0 12px; font-size: 1.375rem; line-height: 1.3; color: #222; }
      .email { display: inline-block; font-size: 0.9375rem; overflow-wrap: anywhere; }
      .content { min-width: 0; }
      .section { scroll-margin-top: 24px; }
      .section h2 {
        margin: 0 0 16px;
        padding-bottom: 7px;
        border-bottom: 1px solid #edf0f2;
        font-size: 1.55rem;
        line-height: 1.35;
        font-weight: 650;
        color: #222;
      }
      .section p { margin: 0; font-size: 1rem; }
      .section + .section { margin-top: 42px; }
      .publications { min-height: 150px; }
      @media (max-width: 700px) {
        .nav { padding: 8px 20px; gap: 8px 20px; }
        .layout { grid-template-columns: 1fr; gap: 40px; padding: 32px 20px 56px; }
        .portrait { width: 136px; height: 136px; margin-bottom: 16px; }
        .section h2 { font-size: 1.4rem; }
      }
      @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
    </style>
  </head>
  <body>
    <a class="skip-link" href="#about-me">Skip to content</a>
    <header class="masthead">
      <nav class="nav" aria-label="Primary navigation">
        <a class="home-link" href="./">Homepage</a>
        <a href="#about-me">About Me</a>
        <a href="#publications">Publications</a>
      </nav>
    </header>
    <div class="layout">
      <aside class="profile" aria-label="Personal information">
        <div class="portrait" aria-hidden="true"></div>
        <h1>Xiai Zhang</h1>
        <a class="email" href="mailto:zhangxiai@smail.nju.edu.cn">zhangxiai@smail.nju.edu.cn</a>
      </aside>
      <main class="content">
        <section class="section" id="about-me" aria-labelledby="about-title">
          <h2 id="about-title"><span aria-hidden="true">🤔 </span>About Me</h2>
          <p>I am Xiai Zhang, currently a master’s student at the School of Intelligence Science and Technology, Nanjing University, under the supervision of Prof. Xiaotong Yuan.</p>
        </section>
        <section class="section publications" id="publications" aria-labelledby="publications-title">
          <h2 id="publications-title"><span aria-hidden="true">📝 </span>Publications</h2>
          <!-- Add publications here when ready. -->
        </section>
      </main>
    </div>
  </body>
</html>
